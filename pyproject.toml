[project]
name = "harpy"
version = "0.1.0"
description = "Terminal PR review tool that compresses code volume, not decision information."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Harpy contributors" }]
dependencies = [
    "typer>=0.12",
    "textual>=1.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "tree-sitter==0.25.2",
    "tree-sitter-python==0.25.0",
    "tree-sitter-typescript==0.23.2",
    "tree-sitter-go==0.25.0",
    "tree-sitter-rust==0.24.2",
    "tree-sitter-sql==0.3.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "syrupy>=4.0",
    "ruff>=0.6",
    "mypy>=1.11,<2",
    "setuptools>=68",
    "wheel",
]

[project.scripts]
harpy = "harpy.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"harpy.analysis.syntax" = ["queries/*.scm"]
"harpy.tui" = ["*.tcss"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
exclude = ["tests/fixtures", ".venv", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID"]
ignore = ["E501"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"subprocess".msg = "Use harpy.proc.run; subprocess is banned outside src/harpy/proc.py"

[tool.ruff.lint.per-file-ignores]
"src/harpy/proc.py" = ["TID"]
"tests/**" = ["TID"]
"scripts/**" = ["TID"]

[tool.ruff.lint.isort]
known-first-party = ["harpy"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
sqlite_cache = false
exclude = ["tests/fixtures"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "cursor: live cursor-agent integration (excluded from make check)",
]
addopts = "-q --strict-markers"

[tool.uv]
package = true
